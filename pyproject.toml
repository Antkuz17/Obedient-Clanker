[project]
name = "hope-drone"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pymavlink", "numpy", "opencv-python-headless"]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
