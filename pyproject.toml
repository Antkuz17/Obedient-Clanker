[project]
name = "hope-drone"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pymavlink", "numpy", "opencv-python-headless"]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "httpx", "websockets", "fastapi", "uvicorn", "python-multipart",
       "paramiko"]  # paramiko: deploy_pi, field_setup, voice_flights preflight (SSH to the Pi)
# laptop station and Vultr cloud (never on the Pi)
station = ["httpx", "websockets"]
cloud = ["httpx", "websockets", "fastapi", "uvicorn[standard]", "python-multipart"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
